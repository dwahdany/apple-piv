name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PC/SC headers (pyscard, a dependency of yubikey-manager, builds against them)
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev swig
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  firmware:
    # Checks that the firmware source builds. The images that apple-piv flashes
    # are the ones committed in src/apple_piv/firmware/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib libusb-1.0-0-dev
      - name: Pico SDK
        run: git clone --depth 1 --branch 2.3.1 --recurse-submodules --shallow-submodules https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
      - name: Build
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          for board in pico pico2; do
            cmake -S firmware -B "build-$board" -DPICO_BOARD="$board" -DCMAKE_BUILD_TYPE=Release
            cmake --build "build-$board" -j4
          done
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build-*/softkey_bridge.uf2
