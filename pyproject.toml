[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apple-piv"
version = "0.1.0"
description = "A touch-free security key for an Apple Account, with its private key held by a YubiKey"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography",
    "fido2>=2.2,<3",
    "pyrage>=1.2",
    "pyserial>=3.5",
    "pyusb>=1.2",
    "segno>=1.6",
    "yubikey-manager>=5.5,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]

[project.scripts]
apple-piv = "apple_piv.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_piv"]

[tool.pytest.ini_options]
timeout = 60
testpaths = ["tests"]
